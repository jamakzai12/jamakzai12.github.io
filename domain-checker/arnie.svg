    <linearGradient id="violet" x1="49" y1="111" x2="129" y2="196" gradientUnits="userSpaceOnUse"><stop stop-color="#9382FF"/><stop offset=".4" stop-color="#7864F4"/><stop offset="1" stop-color="#5140CB"/></linearGradient>
